<!DOCTYPE html>
<html>

<head>

    <title>
        {% block title %}
        AES Project
        {% endblock %}
    </title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}">

</head>
<body>
    
    <!-- NAVBAR -->

    <nav class="navbar-custom d-flex align-items-center">

        <!-- LEFT / CENTER LINKS -->
        <div class="nav-center d-flex mx-auto">

            <a href="/"
            class="nav-link {% if active_page == 'aes' %}active{% endif %}">
                AES Encryption
            </a>

            <a href="/image-encryption"
            class="nav-link {% if active_page == 'image' %}active{% endif %}">
                Image Encryption
            </a>

        </div>

        <!-- RIGHT SIDE -->
        <div class="d-flex ms-right">

            <button id="themeToggle"
                    class="btn btn-dark theme-btn">
                🌙 Dark 
            </button>

        </div>

    </nav>
<!-- 
    <button
        id="themeToggle"
        class="btn btn-dark theme-btn">

        🌙 Dark Mode

    </button> -->

    <!-- PAGE CONTENT -->

    {% block content %}
    {% endblock %}

    <script
    src="{{ url_for(
        'static',
        filename='js/main.js'
    ) }}">
    </script>

    {% block scripts %}
    {% endblock %}

</body>

</html>
