<!DOCTYPE html>
<html>

<head>
    <title>
        {% block title %}
        AES Project
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar-custom d-flex align-items-center">
        <div class="nav-left d-flex">
            <a href="/" class="btn btn-primary">AES-256</a>
        </div>
        <div class="nav-center d-flex mx-auto">
            <a href="/" class="nav-link {% if active_page == 'aes' %}active{% endif %}"> <strong>Text Encryption</strong> </a>
            <a href="/image-encryption" class="nav-link {% if active_page == 'image' %}active{% endif %}"> <strong>Image Encryption</strong> </a>
        </div>
        <div class="d-flex ms-right">
            <button id="themeToggle" class="btn btn-dark theme-btn">🌙 Dark </button>
        </div>
    </nav>
    <div class="gradient-background">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
        <div class="glow"></div>
        <div class="grid-overlay"></div>
        <div class="noise-overlay"></div>
        <div class="particles-container" id="particles-container"></div>
    </div>

    {% block content %}
    {% endblock %}

    <script
    src="{{ url_for(
        'static',
        filename='js/main.js'
    ) }}">
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
